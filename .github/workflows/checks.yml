name: appforge-checks

# Reusable workflow (P1-09, first scope): permission-diff PR comment + secret scanning.
# OSV dependency scanning, a CSP check, and bundle-size reporting are a deliberate follow-up —
# not built here — see the master plan §36-adjacent backlog (P1-09 continuation).
#
# A caller repo adds a small workflow that does:
#   jobs:
#     appforge-checks:
#       uses: ravitejakamalapuram/appforge-kit/.github/workflows/checks.yml@main
#       with:
#         manifest-path: apps/extension/dist/manifest.json
#       permissions:
#         contents: read
#         pull-requests: write

on:
  workflow_call:
    inputs:
      build-command:
        description: "Shell command that installs deps and builds the extension, producing manifest-path"
        required: false
        type: string
        default: "npm ci && npm run build"
      manifest-path:
        description: "Path to the built manifest.json, relative to the caller repo root"
        required: true
        type: string
      permissions-path:
        description: "Path to .appforge/permissions.yaml, relative to the caller repo root"
        required: false
        type: string
        default: ".appforge/permissions.yaml"
      node-version:
        required: false
        type: string
        default: "22"
      appforge-kit-ref:
        description: "appforge-kit ref to check out and build the CLI from. No tagged releases exist yet, so this defaults to main — pin to a tag once appforge-kit starts versioning releases."
        required: false
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  permissions-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Build
        run: ${{ inputs.build-command }}

      - name: Save built manifest
        run: cp "${{ inputs.manifest-path }}" "${{ runner.temp }}/head-manifest.json"

      # The permission-diff (which permissions are newly added, and are any of them high-risk)
      # only means something relative to a base to compare against, so it only runs for PRs.
      - name: Checkout base ref
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: appforge-base-checkout

      - name: Build base ref
        if: github.event_name == 'pull_request'
        working-directory: appforge-base-checkout
        run: ${{ inputs.build-command }}

      - name: Save base manifest
        if: github.event_name == 'pull_request'
        run: cp "appforge-base-checkout/${{ inputs.manifest-path }}" "${{ runner.temp }}/base-manifest.json"

      - name: Checkout appforge-kit
        uses: actions/checkout@v4
        with:
          repository: ravitejakamalapuram/appforge-kit
          ref: ${{ inputs.appforge-kit-ref }}
          path: appforge-kit-checkout

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Build the appforge CLI
        working-directory: appforge-kit-checkout
        run: pnpm install --frozen-lockfile && pnpm build

      - name: appforge validate
        run: |
          node appforge-kit-checkout/packages/cli/dist/index.js validate \
            --file "${{ inputs.permissions-path }}" --json | tee "${{ runner.temp }}/validate.json"

      - name: appforge security permissions
        if: github.event_name == 'pull_request'
        run: |
          node appforge-kit-checkout/packages/cli/dist/index.js security permissions \
            --manifest "${{ runner.temp }}/head-manifest.json" \
            --permissions "${{ inputs.permissions-path }}" \
            --previous-manifest "${{ runner.temp }}/base-manifest.json" \
            --json | tee "${{ runner.temp }}/security.json"

      - name: Post or update the PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tmp = process.env.RUNNER_TEMP;
            const validate = JSON.parse(fs.readFileSync(`${tmp}/validate.json`, 'utf8'));
            const security = JSON.parse(fs.readFileSync(`${tmp}/security.json`, 'utf8'));
            const marker = '<!-- appforge-checks -->';
            const lines = [marker, '### AppForge checks', ''];
            lines.push(
              validate.ok
                ? '✅ `permissions.yaml` schema valid'
                : '❌ `permissions.yaml` schema invalid:\n' + validate.errors.map((e) => `- ${e}`).join('\n')
            );
            lines.push('');
            lines.push(
              security.ok
                ? '✅ No undocumented, unused, or newly-added high-risk permissions'
                : '❌ Permission issues found:\n' + security.errors.map((e) => `- ${e}`).join('\n')
            );
            if (!security.ok && security.data?.highRisk?.length > 0) {
              lines.push('', '**⚠️ New high-risk permissions require board approval before this can ship.**');
            }
            const body = lines.join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Fail the job if any appforge check failed
        run: |
          tmp="${{ runner.temp }}"
          ok=$(jq -r '.ok' "$tmp/validate.json")
          if [ "$ok" != "true" ]; then
            echo "::error::appforge validate failed — see the step output above"
            exit 1
          fi
          if [ -f "$tmp/security.json" ]; then
            ok2=$(jq -r '.ok' "$tmp/security.json")
            if [ "$ok2" != "true" ]; then
              echo "::error::appforge security permissions failed — see the PR comment or step output above"
              exit 1
            fi
          fi

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
