name: ci

on:
  pull_request:
  push:
    branches: [main]

# This repo publishes no store items and holds no store/cloud credentials, so — unlike the
# release-platform-based CI in the product repos — this workflow needs no OIDC/id-token access
# and no secrets at all. It only verifies the workspace: typecheck, build (every package's real
# build script, including `vite build` for Chrome extension templates), test, and lint.
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `packages/e2e`'s postinstall only fetches the Chromium binary Playwright pins (`playwright
      # install chromium`); it does not install the OS shared libraries Chromium needs to actually
      # launch on a bare Linux runner (Playwright documents `install-deps` as required for that on
      # Linux). ubuntu-latest usually has enough of them already, so relying on that silently would
      # mean a runner-image change surfaces as an opaque launch failure instead of a clear step.
      - run: pnpm --filter @appforge/e2e exec playwright install-deps chromium

      - run: pnpm typecheck

      - run: pnpm build

      - name: Run the Playwright e2e harness against chrome-vanilla (P1-11 real invocation)
        run: pnpm --filter appforge-chrome-vanilla-template run test:e2e

      - run: pnpm test

      - run: pnpm lint
